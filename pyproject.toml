[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-classroom-monitoring-backend"
version = "1.0.0"
description = "AI-Powered Classroom Monitoring System Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "opencv-contrib-python",
    "numpy",
    "mediapipe==0.10.14",
    "ultralytics",
    "sounddevice",
    "webrtcvad-wheels",
    "httpx",
    "pytest",
]

[tool.vercel]
entrypoint = "ai-services.api.main:app"
